openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Restaurant Ordering & Table Reservation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: dashboard
    description: Dashboard summaries per role

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin/owner only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /dashboard/customer:
    get:
      operationId: getCustomerDashboard
      tags: [dashboard]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Customer dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"

  /dashboard/staff:
    get:
      operationId: getStaffDashboard
      tags: [dashboard]
      summary: Staff dashboard summary
      responses:
        "200":
          description: Staff dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDashboard"

  /dashboard/kitchen:
    get:
      operationId: getKitchenDashboard
      tags: [dashboard]
      summary: Kitchen staff dashboard summary
      responses:
        "200":
          description: Kitchen dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenDashboard"

  /dashboard/manager:
    get:
      operationId: getManagerDashboard
      tags: [dashboard]
      summary: Manager dashboard summary
      responses:
        "200":
          description: Manager dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerDashboard"

  /dashboard/owner:
    get:
      operationId: getOwnerDashboard
      tags: [dashboard]
      summary: Owner dashboard summary
      responses:
        "200":
          description: Owner dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        full_name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
      required:
        - email
        - password
        - full_name

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [customer, staff, kitchen_staff, manager, owner, admin]
        phone:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
        - id
        - email
        - full_name
        - role
        - is_active
        - created_at

    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: ["string", "null"]
        is_active:
          type: boolean

    CustomerDashboard:
      type: object
      properties:
        role:
          type: string
        total_orders:
          type: integer
        pending_reservations:
          type: integer
        loyalty_points:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_orders
        - pending_reservations
        - loyalty_points
        - recent_activity

    StaffDashboard:
      type: object
      properties:
        role:
          type: string
        active_tables:
          type: integer
        pending_orders:
          type: integer
        todays_reservations:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - active_tables
        - pending_orders
        - todays_reservations
        - recent_activity

    KitchenDashboard:
      type: object
      properties:
        role:
          type: string
        orders_in_queue:
          type: integer
        orders_completed_today:
          type: integer
        avg_prep_time_minutes:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - orders_in_queue
        - orders_completed_today
        - avg_prep_time_minutes
        - recent_activity

    ManagerDashboard:
      type: object
      properties:
        role:
          type: string
        total_revenue_today:
          type: number
        total_orders_today:
          type: integer
        staff_on_duty:
          type: integer
        pending_issues:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_revenue_today
        - total_orders_today
        - staff_on_duty
        - pending_issues
        - recent_activity

    OwnerDashboard:
      type: object
      properties:
        role:
          type: string
        total_revenue_month:
          type: number
        total_orders_month:
          type: integer
        total_customers:
          type: integer
        total_staff:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_revenue_month
        - total_orders_month
        - total_customers
        - total_staff
        - recent_activity

    AdminDashboard:
      type: object
      properties:
        role:
          type: string
        total_users:
          type: integer
        active_sessions:
          type: integer
        system_status:
          type: string
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_users
        - active_sessions
        - system_status
        - recent_activity

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
      required:
        - id
        - description
        - timestamp
        - type
