openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Restaurant Ordering & Table Reservation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: menu
    description: Menu item management
  - name: orders
    description: Order management
  - name: reservations
    description: Table reservation management
  - name: dashboard
    description: Dashboard summaries per role

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin/owner only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: available_only
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a menu item (manager/owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menu/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item (manager/owner/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item (manager/owner/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (own for customers, all for staff+)
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (staff/kitchen/manager+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List reservations (own for customers, all for staff+)
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a table reservation (requires ₱200+ order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationInput"
      responses:
        "201":
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get a reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateReservation
      tags: [reservations]
      summary: Update reservation status/notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationInput"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/customer:
    get:
      operationId: getCustomerDashboard
      tags: [dashboard]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Customer dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"

  /dashboard/staff:
    get:
      operationId: getStaffDashboard
      tags: [dashboard]
      summary: Staff dashboard summary
      responses:
        "200":
          description: Staff dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDashboard"

  /dashboard/kitchen:
    get:
      operationId: getKitchenDashboard
      tags: [dashboard]
      summary: Kitchen staff dashboard summary
      responses:
        "200":
          description: Kitchen dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenDashboard"

  /dashboard/manager:
    get:
      operationId: getManagerDashboard
      tags: [dashboard]
      summary: Manager dashboard summary
      responses:
        "200":
          description: Manager dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerDashboard"

  /dashboard/owner:
    get:
      operationId: getOwnerDashboard
      tags: [dashboard]
      summary: Owner dashboard summary
      responses:
        "200":
          description: Owner dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        full_name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
      required:
        - email
        - password
        - full_name

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [customer, staff, kitchen_staff, manager, owner, admin]
        phone:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
        - id
        - email
        - full_name
        - role
        - is_active
        - created_at

    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: ["string", "null"]
        is_active:
          type: boolean
        role:
          type: string
          enum: [customer, staff, kitchen_staff, manager, owner, admin]

    MenuItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        category:
          type: string
          enum: [appetizer, main, dessert, drink, side, special]
        image_url:
          type: ["string", "null"]
        is_available:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - price
        - category
        - is_available
        - sort_order
        - created_at
        - updated_at

    MenuItemInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        price:
          type: number
          minimum: 0
        category:
          type: string
          enum: [appetizer, main, dessert, drink, side, special]
        image_url:
          type: ["string", "null"]
        is_available:
          type: boolean
        sort_order:
          type: integer
      required:
        - name
        - price
        - category

    MenuItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        price:
          type: number
          minimum: 0
        category:
          type: string
          enum: [appetizer, main, dessert, drink, side, special]
        image_url:
          type: ["string", "null"]
        is_available:
          type: boolean
        sort_order:
          type: integer

    CustomerDashboard:
      type: object
      properties:
        role:
          type: string
        total_orders:
          type: integer
        pending_reservations:
          type: integer
        loyalty_points:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_orders
        - pending_reservations
        - loyalty_points
        - recent_activity

    StaffDashboard:
      type: object
      properties:
        role:
          type: string
        active_tables:
          type: integer
        pending_orders:
          type: integer
        todays_reservations:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - active_tables
        - pending_orders
        - todays_reservations
        - recent_activity

    KitchenDashboard:
      type: object
      properties:
        role:
          type: string
        orders_in_queue:
          type: integer
        orders_completed_today:
          type: integer
        avg_prep_time_minutes:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - orders_in_queue
        - orders_completed_today
        - avg_prep_time_minutes
        - recent_activity

    OrderCountsByStatus:
      type: object
      properties:
        pending:
          type: integer
        confirmed:
          type: integer
        preparing:
          type: integer
        ready:
          type: integer
        delivered:
          type: integer
        cancelled:
          type: integer
      required:
        - pending
        - confirmed
        - preparing
        - ready
        - delivered
        - cancelled

    ManagerDashboard:
      type: object
      properties:
        role:
          type: string
        total_revenue_today:
          type: number
        total_orders_today:
          type: integer
        staff_on_duty:
          type: integer
        avg_fulfillment_minutes:
          type: number
        order_counts_by_status:
          $ref: "#/components/schemas/OrderCountsByStatus"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_revenue_today
        - total_orders_today
        - staff_on_duty
        - avg_fulfillment_minutes
        - order_counts_by_status
        - recent_activity

    OwnerDashboard:
      type: object
      properties:
        role:
          type: string
        total_revenue_month:
          type: number
        total_orders_month:
          type: integer
        total_customers:
          type: integer
        total_staff:
          type: integer
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_revenue_month
        - total_orders_month
        - total_customers
        - total_staff
        - recent_activity

    AdminDashboard:
      type: object
      properties:
        role:
          type: string
        total_users:
          type: integer
        active_sessions:
          type: integer
        system_status:
          type: string
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - role
        - total_users
        - active_sessions
        - system_status
        - recent_activity

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
      required:
        - id
        - description
        - timestamp
        - type

    OrderItemOutput:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
        menu_item_id:
          type: string
        menu_item_name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
        subtotal:
          type: number
      required:
        - id
        - order_id
        - menu_item_id
        - menu_item_name
        - quantity
        - unit_price
        - subtotal

    Order:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]
        total_amount:
          type: number
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemOutput"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - customer_id
        - status
        - total_amount
        - items
        - created_at
        - updated_at

    CreateOrderInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              menu_item_id:
                type: string
              quantity:
                type: integer
                minimum: 1
            required:
              - menu_item_id
              - quantity
        notes:
          type: ["string", "null"]
      required:
        - items

    UpdateOrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]
      required:
        - status

    Reservation:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        order_id:
          type: ["string", "null"]
        reservation_date:
          type: string
        reservation_time:
          type: string
        guest_count:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, seated, completed, cancelled]
        notes:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - customer_id
        - reservation_date
        - reservation_time
        - guest_count
        - status
        - created_at
        - updated_at

    CreateReservationInput:
      type: object
      properties:
        order_id:
          type: string
        reservation_date:
          type: string
        reservation_time:
          type: string
        guest_count:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
      required:
        - order_id
        - reservation_date
        - reservation_time
        - guest_count

    UpdateReservationInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, seated, completed, cancelled]
        notes:
          type: ["string", "null"]
